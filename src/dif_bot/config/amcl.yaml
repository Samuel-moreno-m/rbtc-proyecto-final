# Practica 4 - Localizacion con AMCL (+ map_server)
amcl:
  ros__parameters:
    use_sim_time: true
    # Modelo de movimiento diferencial y ruido de odometria
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.2   # rot -> rot
    alpha2: 0.2   # trans -> rot
    alpha3: 0.2   # trans -> trans
    alpha4: 0.2   # rot -> trans
    alpha5: 0.2

    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: scan
    tf_broadcast: true
    transform_tolerance: 1.0

    # Filtro de particulas (KLD-sampling)
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    update_min_d: 0.15     # m recorridos antes de actualizar
    update_min_a: 0.2      # rad girados antes de actualizar
    recovery_alpha_slow: 0.001   # >0 habilita reinyeccion de particulas aleatorias
    recovery_alpha_fast: 0.1     # (robot secuestrado / pose inicial incorrecta)

    # Modelo del laser
    laser_model_type: "likelihood_field"
    laser_min_range: 0.12
    laser_max_range: 12.0
    laser_likelihood_max_dist: 2.0
    max_beams: 60
    sigma_hit: 0.2
    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    lambda_short: 0.1
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3

    save_pose_rate: 0.5
    # Pose inicial (el robot aparece en (0,0,0) en el mundo y en el mapa)
    set_initial_pose: true
    always_reset_initial_pose: false
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

map_server:
  ros__parameters:
    use_sim_time: true
    # yaml_filename se pasa desde localization.launch.py (argumento map:=)
